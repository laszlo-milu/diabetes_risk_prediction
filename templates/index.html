<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diabetes Risk Prediction</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Diabetes Risk Prediction</h1>
      
      <nav>
        <button id="nav-summary" class="nav-btn active">Dataset Summary</button>
        <button id="nav-visualizations" class="nav-btn">Visualizations</button>
        <button id="nav-predict" class="nav-btn">Predict Risk</button>
      </nav>

      <section id="summary-section">
        <h2>Dataset Summary</h2>
        <div id="summary-content">Loading...</div>
      </section>

      <section id="visualizations-section" class="hidden">
        <h2>Visualizations</h2>
        <div id="visualizations-content">Loading...</div>
      </section>

      <section id="predict-section" class="hidden">
        <p>Enter patient attribute values from the sklearn diabetes dataset and receive a risk prediction.</p>

        <form id="prediction-form">
          <div class="grid">
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" step="0.01" id="age" name="age" required />
            </div>
            <div class="form-group">
              <label for="sex">Sex</label>
              <input type="number" step="0.01" id="sex" name="sex" required />
            </div>
            <div class="form-group">
              <label for="bmi">BMI</label>
              <input type="number" step="0.01" id="bmi" name="bmi" required />
            </div>
            <div class="form-group">
              <label for="bp">BP</label>
              <input type="number" step="0.01" id="bp" name="bp" required />
            </div>
            <div class="form-group">
              <label for="s1">S1 (tc)</label>
              <input type="number" step="0.01" id="s1" name="s1" required />
            </div>
            <div class="form-group">
              <label for="s2">S2 (ldl)</label>
              <input type="number" step="0.01" id="s2" name="s2" required />
            </div>
            <div class="form-group">
              <label for="s3">S3 (hdl)</label>
              <input type="number" step="0.01" id="s3" name="s3" required />
            </div>
            <div class="form-group">
              <label for="s4">S4 (tch)</label>
              <input type="number" step="0.01" id="s4" name="s4" required />
            </div>
            <div class="form-group">
              <label for="s5">S5 (ltg)</label>
              <input type="number" step="0.01" id="s5" name="s5" required />
            </div>
            <div class="form-group">
              <label for="s6">S6 (glu)</label>
              <input type="number" step="0.01" id="s6" name="s6" required />
            </div>
          </div>

          <button type="submit">Predict Risk</button>
        </form>

        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
