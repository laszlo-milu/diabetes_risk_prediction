<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diabetes Risk Prediction</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Diabetes Risk Prediction</h1>
      
      <nav>
        <button id="nav-summary" class="nav-btn active">Dataset Summary</button>
        <button id="nav-visualizations" class="nav-btn">Visualizations</button>
        <button id="nav-predict" class="nav-btn">Predict Risk</button>
      </nav>

      <section id="summary-section">
        <h2>Dataset Summary</h2>
        <div id="summary-content">Loading...</div>
      </section>

      <section id="visualizations-section" class="hidden">
        <h2>Visualizations</h2>
        <div id="visualizations-content">Loading...</div>
      </section>

      <section id="predict-section" class="hidden">
        <p>Enter patient attribute values from the sklearn diabetes dataset and receive a risk prediction.</p>

        <form id="prediction-form">
          <div class="grid">
            <label>Age (standardized)<input type="number" step="0.01" name="age" required /></label>
            <label>Sex (standardized)<input type="number" step="0.01" name="sex" required /></label>
            <label>BMI (standardized)<input type="number" step="0.01" name="bmi" required /></label>
            <label>BP (standardized)<input type="number" step="0.01" name="bp" required /></label>
            <label>S1 (tc, standardized)<input type="number" step="0.01" name="s1" required /></label>
            <label>S2 (ldl, standardized)<input type="number" step="0.01" name="s2" required /></label>
            <label>S3 (hdl, standardized)<input type="number" step="0.01" name="s3" required /></label>
            <label>S4 (tch, standardized)<input type="number" step="0.01" name="s4" required /></label>
            <label>S5 (ltg, standardized)<input type="number" step="0.01" name="s5" required /></label>
            <label>S6 (glu, standardized)<input type="number" step="0.01" name="s6" required /></label>
          </div>

          <button type="submit">Predict Risk</button>
        </form>

        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <script>
      // Navigation
      const navButtons = document.querySelectorAll('.nav-btn');
      const sections = document.querySelectorAll('section');

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          navButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          sections.forEach(s => s.classList.add('hidden'));
          const sectionId = btn.id.replace('nav-', '') + '-section';
          document.getElementById(sectionId).classList.remove('hidden');
        });
      });

      // Load summary
      async function loadSummary() {
        try {
          const response = await fetch('/api/summary');
          const data = await response.json();
          document.getElementById('summary-content').innerHTML = `
            <p><strong>Total Patients:</strong> ${data.total_patients}</p>
            <h3>Averages</h3>
            <ul>
              ${Object.entries(data.averages).map(([k, v]) => `<li>${k}: ${v.toFixed(2)}</li>`).join('')}
            </ul>
            <h3>Minimums</h3>
            <ul>
              ${Object.entries(data.mins).map(([k, v]) => `<li>${k}: ${v.toFixed(2)}</li>`).join('')}
            </ul>
            <h3>Maximums</h3>
            <ul>
              ${Object.entries(data.maxs).map(([k, v]) => `<li>${k}: ${v.toFixed(2)}</li>`).join('')}
            </ul>
            <h3>Risk Distribution</h3>
            <ul>
              <li>Number of Endangered patients in Scenario 1: ${data.risk_distribution[0] || 0}</li>
              <li>Number of Endangered patients in Scenario 2: ${data.risk_distribution[1] || 0}</li>
            </ul>
          `;
        } catch (error) {
          document.getElementById('summary-content').innerHTML = '<p class="error">Failed to load summary.</p>';
        }
      }

      // Load visualizations
      async function loadVisualizations() {
        try {
          const response = await fetch('/api/visualizations');
          const data = await response.json();
          const container = document.getElementById('visualizations-content');
          container.innerHTML = '';
          
          // BMI vs Target scatter plot
          const div1 = document.createElement('div');

          container.appendChild(div1);
          Plotly.newPlot(div1, data.bmi_target_scatter.data, data.bmi_target_scatter.layout);

          // BP vs Target scatter plot
          const div2 = document.createElement('div');

          container.appendChild(div2);
          Plotly.newPlot(div2, data.bp_target_scatter.data, data.bp_target_scatter.layout);
          
          // Pie chart
          const div3 = document.createElement('div');
          const div4 = document.createElement('div');

          container.appendChild(div3);
          const pie_data1 = [{labels:data.risk_pie.x_array, values:data.risk_pie.y_array_s1, type:"pie"}];
          Plotly.newPlot(div3, pie_data1, {title:"Risk Distribution Scenario 1"});

          container.appendChild(div4);
          const pie_data2 = [{labels:data.risk_pie.x_array, values:data.risk_pie.y_array_s2, type:"pie"}];
          Plotly.newPlot(div4, pie_data2, {title:"Risk Distribution Scenario 2"});

        } catch (error) {
          console.error(error);
          document.getElementById('visualizations-content').innerHTML = '<p class="error">Failed to load visualizations.</p>';
        }
      }

      // Prediction form
      const form = document.getElementById('prediction-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = {};
        formData.forEach((value, key) => {
          payload[key] = Number(value);
        });

        result.classList.remove('hidden');
        result.textContent = 'Predicting...';

        try {
          const response = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Prediction failed');
          }

          result.innerHTML = `
            <p><strong>Scenario 1</strong></p>
            <p><strong>Risk:</strong> ${data.risk_label_s1}</p>
            <p><strong>Probability:</strong> ${Math.round(data.risk_probability_s1 * 100)}%</p>
            <p><strong>Scenario 2</strong></p>
            <p><strong>Risk:</strong> ${data.risk_label_s2}</p>
            <p><strong>Probability:</strong> ${Math.round(data.risk_probability_s2 * 100)}%</p>
          `;
        } catch (error) {
          result.innerHTML = `<p class="error">${error.message}</p>`;
        }
      });

      // Load data on page load
      loadSummary();
      loadVisualizations();
    </script>
  </body>
</html>
